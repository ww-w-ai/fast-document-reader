[package]
name = "fastdoc-engine"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
swiftshim = { path = "../swiftshim" }
serde = { version = "1", features = ["derive"] }
# `float_roundtrip` is NOT serde_json's default: its fast float parser is allowed to land one ULP
# away, and it does. A document's own declared geometry — a column 96.23622047244095 points wide —
# came back as ...096, which is harmless to look at and fatal to CHECK. A boundary that is only
# nearly lossless cannot be told apart from one that has a real defect in it, and the round-trip
# test that proves this one is exact is the only guard the port has here.
serde_json = { version = "1", features = ["float_roundtrip"] }

# The SAME rhwp commit the shipped xcframework was built from (Vendor/RHWP-SOURCE.txt). Pinned by
# rev on purpose: the Swift reader links that xcframework, so a floating rev would let the two
# readers parse a document with different parser builds — and every difference the corpus comparison
# turns up would then be unattributable.
#
# THE PIN LIVES IN FIVE PLACES. Bumping this one alone builds green and changes NOTHING, because
# `rust/Cargo.lock` keeps resolving the old commit — measured: the fork's PUA fix was pushed, this
# line was bumped, the engine and app were rebuilt, and the document still carried all 97 private-use
# characters. Bump ALL of these together:
#   1. this line
#   2. rust/crates/swiftshim/Cargo.toml  — the SECOND manifest pinning the same crate
#   3. rust/Cargo.lock                   — `cd rust && cargo update -p rhwp` (name the full
#                                          `git+…#rhwp@0.7.19` spec when two revs are present)
#   4. Scripts/rust-baseline.py `PIN`    — the baseline checker's own copy
#   5. Tests/Baseline/fixtures.json      — `immutableRevision` on every submodule-file fixture
# and then Vendor/RHWP-SOURCE.txt via `./Scripts/record-rhwp-source.sh`, after rebuilding the
# xcframework — otherwise the recorded sha256 describes a library that is no longer there.
rhwp = { git = "https://github.com/ww-w-ai/rhwp.git", rev = "bcf7acf2fa05a2f00bbe9d4c97b78daa1d20ea00", default-features = false }
flate2 = { workspace = true }
base64 = "0.22"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "tiff"] }

# The shipping Swift path (`swift-markdown`) is cmark-gfm itself; comrak is a direct C-to-Rust port
# of that same parser (652/652 CommonMark + 670/670 GFM spec cases), so parity risk starts lower
# than an independent implementation could. `default-features = false` keeps this a LIBRARY
# dependency only — comrak's default features pull in `clap`/`xdg`/`shell-words` for its bundled
# CLI binary, none of which this crate builds or ships (`cargo tree -p fastdoc-engine` confirms no
# CLI-only crate is present). GFM extensions (tables, task lists, strikethrough) are enabled at
# call time via `ComrakExtensionOptions`, not through a Cargo feature.
comrak = { version = "0.54.0", default-features = false }
